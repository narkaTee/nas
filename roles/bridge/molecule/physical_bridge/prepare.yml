---
- name: Prepare synthetic physical interface
  hosts: all
  gather_facts: false
  tasks:
    - name: Check test uplink
      ansible.builtin.command: ip link show test-uplink
      register: bridge_test_uplink
      changed_when: false
      failed_when: false

    - name: Create test veth pair
      ansible.builtin.command: >-
        ip link add test-uplink type veth peer name test-peer
      when: bridge_test_uplink.rc != 0
      changed_when: true

    - name: Activate test peer
      ansible.builtin.command: ip link set test-peer up
      changed_when: true

    - name: Configure standalone test uplink
      ansible.builtin.blockinfile:
        path: /etc/network/interfaces
        marker: "# {mark} MOLECULE TEST UPLINK"
        block: |
          allow-hotplug test-uplink
          iface test-uplink inet static
              address 198.51.100.2/24
          iface test-uplink inet6 static
              address fd00:eeee::2/64

    - name: Start standalone test uplink
      ansible.builtin.command: ifup test-uplink
      changed_when: true

    # Container runtimes choose different forwarding defaults. Preserve the
    # pre-convergence values so verification checks that the role leaves them unchanged.
    - name: Read initial IPv4 forwarding state
      ansible.builtin.command: sysctl -n net.ipv4.ip_forward
      register: bridge_physical_initial_ipv4_forwarding
      changed_when: false

    - name: Read initial IPv6 forwarding state
      ansible.builtin.command: sysctl -n net.ipv6.conf.all.forwarding
      register: bridge_physical_initial_ipv6_forwarding
      changed_when: false

    - name: Preserve initial forwarding state
      ansible.builtin.copy:
        content: |
          {{ {
            'ipv4': bridge_physical_initial_ipv4_forwarding.stdout,
            'ipv6': bridge_physical_initial_ipv6_forwarding.stdout
          } | to_nice_json }}
        dest: /tmp/molecule-bridge-forwarding.json
        owner: root
        group: root
        mode: "0600"
