---
- name: Configure isolated bridge
  ansible.builtin.template:
    dest: /etc/network/interfaces.d/bridge-{{ bridge.ifname }}
    src: bridge-isolated.j2
    owner: root
    group: root
    mode: "0644"
  register: bridge_config
  tags: bridge

- name: Enable routing
  ansible.builtin.template:
    src: templates/sysctl-ip-forwarding.conf.j2
    dest: /etc/sysctl.d/50-ip-forwarding.conf
    owner: root
    group: root
    mode: "0644"
  notify: Reload sysctl
  tags: bridge

- name: Restart isolated bridge
  when: bridge_config.changed
  tags: bridge
  block:
    - name: Shut down isolated bridge
      ansible.builtin.command: ifdown {{ bridge.ifname }}

    - name: Start isolated bridge
      ansible.builtin.command: ifup {{ bridge.ifname }}

- name: Disable DAD
  ansible.posix.sysctl:
    name: net.ipv6.conf.{{ bridge.ifname }}.accept_dad
    value: "0"
    state: present
    sysctl_file: /etc/sysctl.d/55-disable-dad-{{ bridge.ifname }}.conf
    reload: true
  when:
    - bridge.ipv6 is defined
    - not (bridge.ipv6.dad | default(true))
  tags: bridge

- name: Configure DHCP server
  ansible.builtin.import_tasks: dhcp.yaml
  when: bridge.dhcp_server is defined
  tags: bridge
