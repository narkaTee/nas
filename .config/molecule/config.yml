---
driver:
  name: podman

ansible:
  env:
    ANSIBLE_COLLECTIONS_PATH: "${PWD}/../.."

platforms:
  - name: debian13
    image: docker.io/dokken/debian-13:latest
    privileged: true
    command: /lib/systemd/systemd

scenario:
  test_sequence:
    # - dependency
    - create
    - prepare
    - converge
    - idempotence
    - side_effect
    - verify
    - cleanup
    - destroy
