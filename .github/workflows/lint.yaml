name: lint
on:
  push:
    branches:
      - main

jobs:
  lint:
    name: lint
    runs-on: ubuntu-latest
    steps:
      - name: Check out
        uses: actions/checkout@v7

      - name: Set up uv
        uses: astral-sh/setup-uv@astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d
        with:
          enable-cache: true

      - name: Install dependencies
        run: uv sync --locked

      - name: Install ansible collections
        run: uv run ansible-galaxy install -r requirements.yaml

      - name: Yamllint
        run: uv run yamllint .

      - name: Ansible lint
        run: uv run ansible-lint
